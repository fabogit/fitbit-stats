services:
  api-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
      - ./data:/app/data
      - shared_data:/app/shared
    environment:
      - DATA_DIR=/app/data
      - CLIENT_PUBLIC_DIR=/app/shared
      - PYTHONUNBUFFERED=1
      # Web origins allowed to call the API (comma-separated). Must match the
      # address you open the frontend from.
      - FITSTATS_ALLOWED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - shared_data:/app/shared
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  shared_data:
