services:
  api-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    # No published port: the web UI reaches the API through the frontend's /api and /ws.
    volumes:
      - ./server:/app
      - ./data:/app/data
      - shared_data:/app/shared
    environment:
      - DATA_DIR=/app/data
      - CLIENT_PUBLIC_DIR=/app/shared
      - PYTHONUNBUFFERED=1
      # Not needed for the web UI: the status WebSocket is accepted from a page
      # served at the address the request was sent to, whatever that address is.
      # Set it only to allow another origin (comma-separated), for example when a
      # proxy in front of the frontend rewrites the Host header:
      # - FITSTATS_ALLOWED_ORIGINS=https://fitstats.example
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  shared_data:
