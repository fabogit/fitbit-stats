name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Client (lint, types)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json # pnpm version comes from "packageManager"
          cache: true
          cache_dependency_path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc -b --noEmit

  server:
    name: Server (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install pinned requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest

  desktop:
    name: Desktop (cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Install system dependencies
        # Cached: on a hit the packages are restored without contacting the
        # apt mirrors. build-essential, curl, wget and file are preinstalled
        # on ubuntu-latest, so only the -dev libraries are listed.
        timeout-minutes: 8
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          version: 1

      - name: Verify libs
        run: |
          pkg-config --modversion webkit2gtk-4.1 gtk+-3.0 librsvg-2.0 ayatana-appindicator3-0.1
          dpkg -l | grep -E 'libwebkit2gtk-4.1-dev|libgtk-3-dev'

      - name: Create placeholder sidecar
        # Tauri's build script requires the externalBin file to exist, even for
        # a type check. An empty file with the expected name is enough here.
        run: |
          mkdir -p client/src-tauri/bin
          touch client/src-tauri/bin/fitstats-server-x86_64-unknown-linux-gnu

      - name: Cargo check
        working-directory: ./client/src-tauri
        run: cargo check --locked
