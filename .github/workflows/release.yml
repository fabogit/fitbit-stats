name: Release FitStats (Multi-Platform)

on:
  push:
    tags:
      - "v*" # Triggers only on tag pushes (e.g. git tag v1.0.0 && git push origin v1.0.0)

jobs:
  build-and-release:
    permissions:
      contents: write # Allows Actions to upload the final files to the repo's Release folder

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js (Vite Frontend)
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json # pnpm version comes from "packageManager"
          cache: true
          cache_dependency_path: client/pnpm-lock.yaml

      - name: Setup Python (PyInstaller Backend)
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Setup Rust (Tauri Core)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Install system dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        # No package cache on purpose: release builds must bundle the current,
        # patched system libraries. Retries and timeouts keep a slow mirror
        # from consuming the whole job.
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install React dependencies
        working-directory: ./client
        run: pnpm install

      - name: Run Linter (Guard)
        working-directory: ./client
        run: pnpm run lint

      - name: Build Python Sidecar (Server)
        working-directory: ./server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3
          pyinstaller --clean fitstats-server.spec

      - name: Write sidecar smoke test script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/smoke_sidecar.py" <<'PY'
          """Start the server sidecar found under ROOT and wait for /api/health.

          The sidecar picks a free port itself (FITSTATS_PORT=0) and says which on
          the FITSTATS_READY line of its output, which is where this reads it.

          usage: smoke_sidecar.py ROOT [--reference DIR] [--allow-missing PATH ...]

          ROOT is a folder searched for fitstats-server/fitstats-server[.exe]
          (exactly one match). With --reference, every file and link of DIR
          (the folder PyInstaller built) must also exist next to the executable:
          this catches files a bundler skipped or dropped. --allow-missing names
          a path (relative to the sidecar folder, compared for exact equality)
          that may be missing, only if it is a link to a folder in DIR.
          """
          import argparse
          import json
          import os
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.request

          READY = "FITSTATS_READY "
          NAME = "fitstats-server.exe" if os.name == "nt" else "fitstats-server"
          OPENER = urllib.request.build_opener(urllib.request.ProxyHandler({}))


          def healthy(port):
              try:
                  with OPENER.open(f"http://127.0.0.1:{port}/api/health", timeout=2) as r:
                      return r.status == 200 and json.load(r) == {"status": "ok"}
              except Exception:
                  return False


          def ready_port(log_path):
              """The port of the FITSTATS_READY line in the sidecar output, if it has been printed."""
              with open(log_path, errors="replace") as f:
                  for line in f:
                      if line.startswith(READY):
                          try:
                              return int(json.loads(line[len(READY):])["port"])
                          except (ValueError, KeyError, TypeError):
                              return None
              return None


          def find_exe(root):
              if os.path.isfile(root):
                  return root
              found = []
              for dirpath, _dirs, files in os.walk(root):
                  if NAME in files and os.path.basename(dirpath) == "fitstats-server":
                      found.append(os.path.join(dirpath, NAME))
              if len(found) != 1:
                  sys.exit(f"expected one fitstats-server/{NAME} under {root}, found {len(found)}: {found}")
              return found[0]


          def missing_files(reference, folder):
              missing = []
              for dirpath, dirs, files in os.walk(reference):
                  rel = os.path.relpath(dirpath, reference)
                  for entry in dirs + files:
                      if not os.path.lexists(os.path.normpath(os.path.join(folder, rel, entry))):
                          missing.append(os.path.normpath(os.path.join(rel, entry)))
              return missing


          def stop(proc):
              if os.name == "nt":
                  subprocess.run(["taskkill", "/PID", str(proc.pid), "/T", "/F"], capture_output=True)
              else:
                  proc.terminate()
              try:
                  proc.wait(15)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  proc.wait()


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("root")
              parser.add_argument("--reference")
              parser.add_argument("--allow-missing", action="append", default=[])
              args = parser.parse_args()

              exe = os.path.abspath(find_exe(args.root))
              print(f"sidecar: {exe}")
              if not os.access(exe, os.X_OK):
                  sys.exit("the sidecar is not executable")
              if args.reference:
                  missing = missing_files(args.reference, os.path.dirname(exe))
                  for path in list(missing):
                      source = os.path.join(args.reference, path)
                      if path in args.allow_missing and os.path.islink(source) and os.path.isdir(source):
                          print(f"ALLOWED: link to a folder not kept by the bundler ({path})")
                          missing.remove(path)
                  print(f"files missing from the bundle: {len(missing)}")
                  if missing:
                      sys.exit("missing: " + ", ".join(missing[:20]))

              log = tempfile.NamedTemporaryFile(prefix="sidecar-", suffix=".log", delete=False)
              env = dict(os.environ, FITSTATS_API_TOKEN="0" * 64, FITSTATS_PORT="0")
              proc = subprocess.Popen([exe], env=env, stdin=subprocess.DEVNULL, stdout=log, stderr=subprocess.STDOUT)
              started = time.monotonic()
              ok = False
              try:
                  while time.monotonic() - started < 60:
                      if proc.poll() is not None:
                          break
                      port = ready_port(log.name)
                      if port is not None and healthy(port):
                          ok = True
                          break
                      time.sleep(0.2)
                  elapsed = time.monotonic() - started
                  alive = proc.poll() is None
              finally:
                  if proc.poll() is None:
                      stop(proc)
                  log.close()
              if not (ok and alive):
                  print("--- sidecar output ---")
                  print(open(log.name, errors="replace").read())
                  sys.exit(f"no healthy response (exit code {proc.returncode})")
              print(f"port {port}: /api/health answered 200 after {elapsed:.1f} s")


          if __name__ == "__main__":
              main()
          PY

      - name: Smoke test the built sidecar
        shell: bash
        timeout-minutes: 5
        run: python "$RUNNER_TEMP/smoke_sidecar.py" server/dist

      - name: Write macOS signature check script
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/verify_signatures.sh" <<'SH'
          # usage: verify_signatures.sh FOLDER
          # PyInstaller signs every binary it collects (ad hoc). Fail if one is unsigned or invalid.
          # A framework is signed as a whole bundle, so it is verified as a folder; any other
          # Mach-O file is verified on its own.
          #
          # One exception, written to the log as ALLOWED: the seal of the Python framework
          # does not match its folder. That is already so in PyInstaller's own output and it
          # was the same in the previous release; the server starts and answers regardless,
          # which the smoke tests prove. It is matched as the whole message and only for
          # _internal/Python.framework; any other message or folder fails.
          root="${1%/}"
          fail=0
          count=0
          while IFS= read -r -d '' framework; do
            count=$((count + 1))
            out=$(codesign --verify --strict "$framework" 2>&1) && continue
            relative="${framework#"$root"/}"
            if [ "$relative" = "_internal/Python.framework" ] \
              && [ "$out" = "$framework: code has no resources but signature indicates they must be present" ]; then
              echo "ALLOWED: framework signature seal does not match its folder ($relative)"
            else
              echo "$out"
              echo "::error::bad signature: $framework"
              fail=1
            fi
          done < <(find "$root" -type d -name '*.framework' -prune -print0)
          while IFS= read -r -d '' f; do
            case "$f" in *.framework/*) continue ;; esac
            if file -b "$f" | grep -q 'Mach-O'; then
              count=$((count + 1))
              codesign --verify --strict "$f" || { echo "::error::bad signature: $f"; fail=1; }
            fi
          done < <(find "$root" -type f -print0)
          echo "verified $count signed items"
          [ "$count" -gt 0 ] && [ "$fail" -eq 0 ]
          SH

      - name: Verify sidecar signatures (macOS only)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: bash "$RUNNER_TEMP/verify_signatures.sh" server/dist/fitstats-server

      - name: Copy Sidecar to Tauri resources
        shell: bash
        run: |
          # The whole folder is a bundle resource (see tauri.conf.json). cp -a keeps
          # permissions, signatures and symbolic links as PyInstaller made them.
          mkdir -p client/src-tauri/sidecar
          cp -a server/dist/fitstats-server client/src-tauri/sidecar/
          ls client/src-tauri/sidecar/fitstats-server

      - name: Sync version from package.json to tauri.conf.json
        shell: bash
        run: |
          # Source of Truth: Version is automatically read from client/package.json.
          VERSION=$(jq -r .version client/package.json)
          echo "Setting version to $VERSION (from package.json)"
          jq ".version = \"$VERSION\"" client/src-tauri/tauri.conf.json > tauri.conf.json.tmp && mv tauri.conf.json.tmp client/src-tauri/tauri.conf.json

      - name: Build and Publish with Tauri (Automatic Release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./client
          tagName: ${{ github.ref_name }} # Use the same name as the Tag (e.g. v1.0.0)
          releaseName: "FitStats ${{ github.ref_name }}"
          releaseBody: |
            New auto-compiled native multi-platform release for Mac 🍎, Windows 🖥️, and Linux 🐧.

            ### 🍎 Note for macOS users (Apple Silicon M-series)
            If you see the "App is damaged" or "Unidentified Developer" error, open a Terminal and type:
            ```bash
            xattr -cr /Applications/FitStats.app
            ```
            *(Or drag the app into the terminal after typing `xattr -cr `)*
          releaseDraft: true # published by the publish-release job once every platform succeeded
          prerelease: false

      # The installers are built and uploaded to the draft release above. These steps start the
      # server from inside each one; a failure leaves the release a draft (publish-release is skipped).
      - name: Smoke test the Linux packages
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        timeout-minutes: 10
        run: |
          bundle=client/src-tauri/target/release/bundle
          find "$bundle" -maxdepth 2 | sort
          deb=$(ls "$bundle"/deb/*.deb)
          mkdir "$RUNNER_TEMP/deb-root"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb-root"
          python "$RUNNER_TEMP/smoke_sidecar.py" "$RUNNER_TEMP/deb-root" --reference server/dist/fitstats-server

          appimage=$(ls "$bundle"/appimage/*.AppImage)
          chmod +x "$appimage"
          mkdir "$RUNNER_TEMP/appimage-root"
          (cd "$RUNNER_TEMP/appimage-root" && "$OLDPWD/$appimage" --appimage-extract > /dev/null)
          python "$RUNNER_TEMP/smoke_sidecar.py" "$RUNNER_TEMP/appimage-root" --reference server/dist/fitstats-server

      - name: Smoke test the macOS bundle
        if: matrix.os == 'macos-latest'
        shell: bash
        timeout-minutes: 10
        run: |
          app=client/src-tauri/target/release/bundle/macos/FitStats.app
          res="$app/Contents/Resources/fitstats-server"
          ls "$res"
          bash "$RUNNER_TEMP/verify_signatures.sh" "$res"
          # The bundler copies links to files as files but drops links to folders: the two
          # inside the Python framework are the only files allowed to be missing.
          python "$RUNNER_TEMP/smoke_sidecar.py" "$res" --reference server/dist/fitstats-server \
            --allow-missing _internal/Python.framework/Versions/Current \
            --allow-missing _internal/Python.framework/Resources

      - name: Smoke test the Windows installers
        if: matrix.os == 'windows-latest'
        shell: bash
        timeout-minutes: 10
        run: |
          bundle=client/src-tauri/target/release/bundle
          find "$bundle" -maxdepth 2 | sort
          # MSI: administrative install, which only unpacks the files.
          msi=$(cygpath -w "$(ls "$bundle"/msi/*.msi)")
          target=$(cygpath -w "$RUNNER_TEMP/msi-root")
          powershell -NoProfile -Command "\$p = Start-Process msiexec -ArgumentList '/a','$msi','/qn','TARGETDIR=$target' -Wait -PassThru; exit \$p.ExitCode"
          python "$RUNNER_TEMP/smoke_sidecar.py" "$RUNNER_TEMP/msi-root" --reference server/dist/fitstats-server
          # NSIS: the installer is an archive 7-Zip can open.
          nsis=$(ls "$bundle"/nsis/*.exe)
          7z x -y "-o$RUNNER_TEMP/nsis-root" "$nsis" > /dev/null
          python "$RUNNER_TEMP/smoke_sidecar.py" "$RUNNER_TEMP/nsis-root" --reference server/dist/fitstats-server

      # The installers are installed and the application is started from where it was installed:
      # this runs the whole path (the shell starts the server, learns its port from the handshake
      # and writes it to the log) that the tests above do not. The port is found in the application
      # log, "sidecar ready on port N". Then the application is closed the normal way and no
      # server process may be left.
      - name: Write the installed application test (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/app_smoke.ps1" <<'PS'
          # usage: app_smoke.ps1 <label>   (the application is installed already)
          param([string]$Label)
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:LOCALAPPDATA 'com.fitstats\logs\FitStats.log'
          $dir = @("$env:ProgramFiles\FitStats", "$env:LOCALAPPDATA\FitStats", "$env:LOCALAPPDATA\Programs\FitStats") |
            Where-Object { Test-Path (Join-Path $_ 'fitstats-server\fitstats-server.exe') } | Select-Object -First 1
          if (-not $dir) { throw "$Label: no installed FitStats folder with the server found" }
          Write-Host "$Label: installed in $dir"
          Get-ChildItem $dir | ForEach-Object { Write-Host "  $($_.Name)" }
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $exe) { throw "$Label: no application executable in $dir" }
          if (Test-Path $log) { Remove-Item $log -Force }
          $app = Start-Process $exe.FullName -PassThru
          $port = $null
          $started = Get-Date
          while (((Get-Date) - $started).TotalSeconds -lt 60 -and -not $port) {
            if ($app.HasExited) { throw "$Label: the application exited with code $($app.ExitCode)" }
            if (Test-Path $log) {
              $m = Select-String -Path $log -Pattern 'sidecar ready on port (\d+)' | Select-Object -Last 1
              if ($m) { $port = $m.Matches[0].Groups[1].Value }
            }
            Start-Sleep -Milliseconds 300
          }
          if (-not $port) { if (Test-Path $log) { Get-Content $log }; throw "$Label: no 'sidecar ready' line in the log within 60 s" }
          $ok = $false
          while (((Get-Date) - $started).TotalSeconds -lt 60 -and -not $ok) {
            try { $ok = (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/api/health" -TimeoutSec 2).StatusCode -eq 200 } catch { Start-Sleep -Milliseconds 300 }
          }
          if (-not $ok) { Get-Content $log; throw "$Label: /api/health on port $port did not answer 200" }
          Write-Host ("{0}: port {1}, health 200 after {2:N1} s" -f $Label, $port, ((Get-Date) - $started).TotalSeconds)
          if (-not $app.CloseMainWindow()) { Get-Content $log; throw "$Label: the application has no window to close" }
          if (-not $app.WaitForExit(20000)) { $app.Kill(); throw "$Label: the application did not exit within 20 s of being closed" }
          $limit = (Get-Date).AddSeconds(10)
          while ((Get-Process -Name fitstats-server -ErrorAction SilentlyContinue) -and (Get-Date) -lt $limit) { Start-Sleep -Milliseconds 200 }
          $left = @(Get-Process -Name fitstats-server -ErrorAction SilentlyContinue)
          if ($left.Count -gt 0) { $left | Stop-Process -Force; throw "$Label: $($left.Count) fitstats-server process(es) left after closing" }
          Write-Host "$Label: closed normally, no server process left"
          PS

      - name: Start the installed application (Windows, MSI then NSIS)
        if: matrix.os == 'windows-latest'
        shell: bash
        timeout-minutes: 15
        run: |
          bundle=client/src-tauri/target/release/bundle
          script=$(cygpath -w "$RUNNER_TEMP/app_smoke.ps1")
          msi=$(cygpath -w "$(ls "$bundle"/msi/*.msi)")
          nsis=$(cygpath -w "$(ls "$bundle"/nsis/*.exe)")
          # The MSI first, removed again, then the NSIS installer.
          powershell -NoProfile -Command "\$p = Start-Process msiexec -ArgumentList '/i','$msi','/qn','/norestart' -Wait -PassThru; exit \$p.ExitCode"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$script" MSI
          powershell -NoProfile -Command "\$p = Start-Process msiexec -ArgumentList '/x','$msi','/qn','/norestart' -Wait -PassThru; exit \$p.ExitCode"
          powershell -NoProfile -Command "\$p = Start-Process '$nsis' -ArgumentList '/S' -Wait -PassThru; exit \$p.ExitCode"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$script" NSIS

      - name: Start the installed application (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        timeout-minutes: 10
        run: |
          app=$PWD/client/src-tauri/target/release/bundle/macos/FitStats.app
          log="$HOME/Library/Logs/com.fitstats/FitStats.log"
          rm -f "$log"
          "$app/Contents/MacOS/app" > "$RUNNER_TEMP/app-stdout.log" 2>&1 &
          pid=$!
          port=""
          for _ in $(seq 1 200); do
            kill -0 "$pid" 2>/dev/null || { echo "the application exited"; cat "$RUNNER_TEMP/app-stdout.log"; exit 1; }
            port=$(grep -o 'sidecar ready on port [0-9]*' "$log" 2>/dev/null | tail -1 | awk '{print $5}')
            [ -n "$port" ] && break
            sleep 0.3
          done
          [ -n "$port" ] || { echo "no 'sidecar ready' line in the log within 60 s"; cat "$log" 2>/dev/null; cat "$RUNNER_TEMP/app-stdout.log"; exit 1; }
          ok=""
          for _ in $(seq 1 200); do
            [ "$(curl -s -o /dev/null -m 2 -w '%{http_code}' "http://127.0.0.1:$port/api/health")" = "200" ] && ok=1 && break
            sleep 0.3
          done
          [ -n "$ok" ] || { cat "$log"; echo "/api/health on port $port did not answer 200"; exit 1; }
          echo "port $port: /api/health answered 200"
          osascript -e 'tell application id "com.fitstats" to quit'
          for _ in $(seq 1 100); do kill -0 "$pid" 2>/dev/null || break; sleep 0.2; done
          if kill -0 "$pid" 2>/dev/null; then kill "$pid"; echo "the application did not exit after quit"; exit 1; fi
          for _ in $(seq 1 50); do pgrep -x fitstats-server >/dev/null || break; sleep 0.2; done
          if pgrep -x fitstats-server >/dev/null; then pkill -x fitstats-server; echo "a server process was left after closing"; exit 1; fi
          echo "closed normally, no server process left"

  publish-release:
    # Runs only if every job of the build matrix succeeded; otherwise the release stays a draft.
    # Test tags (v0.0.0-test...) are used to try the workflow and never publish anything.
    needs: build-and-release
    if: ${{ success() && !startsWith(github.ref_name, 'v0.0.0-test') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
