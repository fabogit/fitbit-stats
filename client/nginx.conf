# Connection header for proxied requests: "upgrade" for WebSocket handshakes only.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen       80;
    server_name  localhost;

    # Compress the JSON data file and the static assets (HTML is always on the list).
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      application/json application/javascript text/css image/svg+xml;

    # Docker's embedded DNS. Together with the variable in proxy_pass below, the
    # api-server address is looked up per request, so nginx starts and keeps
    # working when that container is restarted or recreated with a new address.
    resolver 127.0.0.11 valid=10s;

    # The browser talks to this server only: the API is reached through it. The
    # Host and Origin headers are passed on as the browser sent them: the API
    # accepts the status WebSocket from a page served at the host it was sent to.
    location /api/ {
        set $api_upstream http://api-server:8000;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
    }

    # Job status WebSocket.
    location /ws/ {
        set $api_upstream http://api-server:8000;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_buffering    off;
        # The server only writes when the job changes: do not drop an idle socket.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Web build policy (the desktop app sets its own in tauri.conf.json).
        # The page, the API and the WebSocket all share this origin.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
